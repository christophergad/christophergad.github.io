.landmarks-feature{display:flex;flex-direction:column;gap:20px}
.landmark-top{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.landmark-bottom{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.landmark-card{display:block;border:1px solid #deded9;background:rgba(255,255,255,.34);overflow:hidden;transition:transform .18s ease, box-shadow .18s ease}
.landmark-card:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(0,0,0,.06)}
.landmark-card .landmark-thumb{position:relative;background-size:cover;background-position:center;overflow:hidden}
.landmark-card.large .landmark-thumb{aspect-ratio:16/10;min-height:310px}
.landmark-card.small .landmark-thumb{aspect-ratio:16/10;min-height:185px}
.landmark-card .landmark-thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.03) 10%,rgba(0,0,0,.55) 100%)}
.landmark-card .thumb-label{position:absolute;left:22px;right:22px;bottom:20px;z-index:2;color:#fff}
.landmark-card .thumb-kicker{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.landmark-card .thumb-title{margin-top:7px;font-size:34px;line-height:.95;font-weight:420;letter-spacing:-.04em}
.landmark-card.small .thumb-title{font-size:23px}
.landmark-card .work-body{padding:22px 24px 24px}
.landmark-card.large .work-body p{font-size:13px;-webkit-line-clamp:4}
.landmark-card.small .work-body p{font-size:12px;-webkit-line-clamp:3}
.landmark-card.small .work-body h3{font-size:21px}
.landmark-card .chips{margin-top:14px}
.landmark-card .view{margin-top:18px}
@media(max-width:1000px){.landmark-top{grid-template-columns:1fr}.landmark-bottom{grid-template-columns:repeat(2,minmax(0,1fr))}.landmark-bottom .landmark-card:last-child{grid-column:1/-1}}
@media(max-width:760px){.landmark-bottom{grid-template-columns:1fr}.landmark-card.large .landmark-thumb{min-height:250px}.landmark-card.small .landmark-thumb{min-height:180px}.landmark-card .thumb-title{font-size:28px}.landmark-card.small .thumb-title{font-size:22px}}

.project-media-card{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);border:1px solid #deded9;background:rgba(255,255,255,.3);overflow:hidden}

.project-media-copy p{margin:14px 0 0;color:#666661;font-size:13px;line-height:1.6}

@media(max-width:760px){.project-media-card{grid-template-columns:1fr}.project-media-card .media-thumb,.project-media-card .media-thumb iframe{min-height:240px}.project-media-copy{padding:26px}}



/* =========================================================
   PATCH 15 — unified gallery + video layout
   ========================================================= */
.cg-gallery{
  display:grid !important;
  grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) !important;
  gap:10px !important;
  height:clamp(430px,43vw,620px) !important;
  min-height:0 !important;
}
.cg-gallery-main,
.cg-gallery-small .cg-gallery-item{
  appearance:none;
  border:0;
  padding:0;
  margin:0;
  overflow:hidden;
  background:#171717;
  cursor:zoom-in;
  width:100%;
  height:100%;
  min-height:0;
}
.cg-gallery-main img,
.cg-gallery-small .cg-gallery-item img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
}
.cg-gallery-small{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:repeat(2,minmax(0,1fr));
  gap:10px;
  width:100%;
  height:100%;
  min-height:0;
}
.cg-gallery.cg-count-2 .cg-gallery-small{
  grid-template-columns:1fr;
  grid-template-rows:1fr;
}
.cg-gallery.cg-count-3 .cg-gallery-small{
  grid-template-columns:1fr;
  grid-template-rows:repeat(2,minmax(0,1fr));
}
.cg-gallery.cg-count-4 .cg-gallery-small{
  grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:repeat(2,minmax(0,1fr));
}
.cg-gallery.cg-count-4 .cg-gallery-small .cg-gallery-item:last-child{
  grid-column:1/-1;
}
.cg-gallery.cg-count-1{
  grid-template-columns:1fr !important;
}
.cg-gallery.cg-count-1 .cg-gallery-small{
  display:none;
}
.cg-gallery-footer{
  display:flex;
  justify-content:flex-end;
  border-top:1px solid var(--line,#d9d9d4);
  margin-top:14px;
  padding-top:14px;
}
.cg-view-all{
  appearance:none;
  border:0;
  background:transparent;
  padding:0;
  display:inline-flex;
  align-items:center;
  gap:14px;
  color:#171717;
  font:inherit;
  font-size:11px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  cursor:pointer;
}
.cg-view-all:hover{opacity:.55}
.cg-view-all .cg-gallery-arrow{
  font-size:17px;
  line-height:1;
  font-weight:400;
}
.cg-expanded[hidden]{display:none !important}
.cg-expanded{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  margin-top:18px;
  padding-top:18px;
  border-top:1px solid var(--line,#d9d9d4);
}
.cg-expanded-item{
  appearance:none;
  border:0;
  padding:0;
  margin:0;
  aspect-ratio:16/10;
  overflow:hidden;
  background:#171717;
  cursor:zoom-in;
}
.cg-expanded-item img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
}
.video-grid{
  gap:10px !important;
}
.video-grid.cg-video-count-1{
  grid-template-columns:1fr !important;
}
.video-grid.cg-video-count-2,
.video-grid.cg-video-count-4{
  grid-template-columns:repeat(2,minmax(0,1fr)) !important;
}
.video-grid.cg-video-count-3,
.video-grid.cg-video-count-5,
.video-grid.cg-video-count-6{
  grid-template-columns:repeat(3,minmax(0,1fr)) !important;
}
@media(max-width:1000px){
  .cg-expanded{grid-template-columns:repeat(3,minmax(0,1fr))}
  .video-grid.cg-video-count-3,
  .video-grid.cg-video-count-5,
  .video-grid.cg-video-count-6{
    grid-template-columns:repeat(2,minmax(0,1fr)) !important;
  }
}
@media(max-width:760px){
  .cg-gallery{
    grid-template-columns:1fr !important;
    height:auto !important;
  }
  .cg-gallery-main{
    aspect-ratio:16/9;
    height:auto;
  }
  .cg-gallery-small{
    height:auto;
    grid-template-columns:repeat(2,minmax(0,1fr)) !important;
    grid-template-rows:repeat(2,150px) !important;
  }
  .cg-gallery.cg-count-2 .cg-gallery-small,
  .cg-gallery.cg-count-3 .cg-gallery-small{
    grid-template-columns:1fr !important;
    grid-template-rows:auto !important;
  }
  .cg-gallery.cg-count-2 .cg-gallery-item,
  .cg-gallery.cg-count-3 .cg-gallery-item{
    aspect-ratio:16/9;
    height:auto;
  }
  .cg-expanded{grid-template-columns:repeat(2,minmax(0,1fr))}
  .video-grid,
  .video-grid.cg-video-count-1,
  .video-grid.cg-video-count-2,
  .video-grid.cg-video-count-3,
  .video-grid.cg-video-count-4,
  .video-grid.cg-video-count-5,
  .video-grid.cg-video-count-6{
    grid-template-columns:1fr !important;
  }
}


  /* PATCH 15 — consistent Watch Dogs hub hover */
  .landmark-card:hover{
    transform:none !important;
    box-shadow:none !important;
  }


  /* =========================================================
     PATCH 17 — Watch Dogs hub hierarchy alignment
     ========================================================= */

  .wd-focus-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:10px;
  }

  .wd-focus-card{
    position:relative;
    min-height:340px;
    overflow:hidden;
    color:#fff;
    background-size:cover;
    background-position:center;
    isolation:isolate;
  }

  .wd-focus-card::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:-1;
    background:
      linear-gradient(0deg,rgba(0,0,0,.90) 0%,rgba(0,0,0,.55) 34%,rgba(0,0,0,.07) 72%),
      linear-gradient(90deg,rgba(0,0,0,.18),rgba(0,0,0,0));
  }

  .wd-focus-card.one{background-image:url("https://static.wixstatic.com/media/0280ad_b94a2050fee94abbb1205758837cdf18~mv2.jpg")}
  .wd-focus-card.two{background-image:url("https://static.wixstatic.com/media/0280ad_2ec481b7f96e4d8bab0fec74fbac7d3e~mv2.jpg")}
  .wd-focus-card.three{background-image:url("https://static.wixstatic.com/media/0280ad_daed37da19b14ec98889289195708729~mv2.jpg")}

  .wd-focus-copy{
    position:absolute;
    left:24px;
    right:24px;
    bottom:22px;
  }

  .wd-focus-copy h3{
    margin:0;
    font-size:21px;
    line-height:1.15;
    font-weight:650;
    letter-spacing:-.02em;
    text-transform:uppercase;
  }

  .wd-focus-copy p{
    margin:11px 0 0;
    max-width:520px;
    font-size:15px;
    line-height:1.5;
    color:rgba(255,255,255,.84);
  }

  .wd-public-media .video-grid{
    display:grid;
    grid-template-columns:1fr !important;
    gap:10px !important;
  }

  .wd-public-media .media-title{
    margin-bottom:10px;
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.02em;
  }

  .wd-public-media .video-frame{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    overflow:hidden;
    background:#171717;
    background-size:cover;
    background-position:center;
    cursor:pointer;
  }

  .wd-public-media .video-frame iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
    display:block;
  }

  .wd-public-media .play-button{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);

    height:64px;
    border-radius:50%;
    background:rgba(0,0,0,.68);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:24px;
    padding-left:4px;
  }

  .wd-public-media .media-note{
    margin:10px 0 0;
    color:#74746f;
    font-size:12.5px;
    line-height:1.5;
  }

  .wd-project-closing{
    padding:38px 0;
    border-bottom:1px solid var(--line);
  }

  .wd-next-section-heading{
    margin-bottom:24px;
  }

  .wd-next-feature{
    position:relative;
    display:grid;
    grid-template-columns:minmax(0,1.6fr) minmax(330px,.72fr);
    min-height:330px;
    overflow:hidden;
    background:#151515;
    color:#fff;
  }

  .wd-next-feature-image{
    min-height:330px;
    background:
      linear-gradient(90deg,rgba(0,0,0,.02) 58%,rgba(0,0,0,.36) 100%),
      url("https://static.wixstatic.com/media/0280ad_1ff9fd98e0a4430eb2d9e71e683e70ae~mv2.jpg"),
      linear-gradient(135deg,#28231f,#6a5140);
    background-size:cover;
    background-position:center;
    transition:transform .45s ease;
  }

  .wd-next-feature-content{
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:42px 46px;
    background:linear-gradient(135deg,rgba(18,18,18,.98),rgba(25,25,25,.96));
  }

  .wd-next-feature-kicker{
    margin-bottom:14px;
    color:rgba(255,255,255,.58);
    font-size:11px;
    font-weight:700;
    letter-spacing:.1em;

  }

  .wd-next-feature h2{

  /* =========================================================

     ========================================================= */
  .wd-focus-media-section{
    padding:38px 0;
    border-bottom:1px solid var(--line);
  }

  .wd-focus-media-layout{
    display:grid;
    grid-template-columns:minmax(0,1.55fr) minmax(320px,.75fr);
    gap:10px;
    align-items:start;
  }

  .wd-focus-pane,
  .wd-media-pane{
    min-width:0;
  }

  .wd-focus-media-section .section-heading{
    margin-bottom:25px;
  }

  .wd-focus-pane .wd-focus-grid{
    display:grid !important;
    grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr) !important;
    grid-template-rows:repeat(2,minmax(0,1fr));
    gap:10px !important;
    height:430px;
  }

  .wd-focus-pane .wd-focus-card{

  }

  .wd-focus-pane .wd-focus-card.one{

  }

  .wd-media-pane .media-note{

  }

  @media(max-width:1050px){
    .wd-focus-media-layout{
      grid-template-columns:1fr;
      gap:34px;
